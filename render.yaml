services:
  - type: web
    name: data-quality-platform
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dqp-postgres
          property: connectionString
      - key: NEO4J_URI
        sync: false          # set manually: neo4j+s://<id>.databases.neo4j.io
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false          # set manually from Aura console
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually from console.anthropic.com
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Render service URL, e.g. https://data-quality-platform.onrender.com

databases:
  - name: dqp-postgres
    plan: free
    databaseName: dqp
    user: dqp
